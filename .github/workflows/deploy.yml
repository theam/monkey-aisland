name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false
      - name: Record source version
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        if: github.event_name != 'workflow_dispatch'
        run: npm run lint
      - name: Test
        if: github.event_name != 'workflow_dispatch'
        run: npm test
      - name: Run checks available in the selected version
        if: github.event_name == 'workflow_dispatch'
        run: npm run lint --if-present && npm run test --if-present
      - name: Build
        run: npm run build
      - name: Validate Worker package
        if: github.event_name != 'workflow_dispatch'
        run: npx wrangler deploy --dry-run
      - name: Install browser
        if: github.event_name != 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Run browser game checks
        if: github.event_name != 'workflow_dispatch'
        run: npm run test:game
      - name: Check out current deployment configuration
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: deployment-config
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage current deployment configuration
        if: github.event_name != 'pull_request'
        run: cp deployment-config/wrangler.jsonc wrangler.jsonc
      - name: Upload website artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: worker-release
          path: |
            dist
            worker
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://monkeyaisland.theagilemonkeys.com
    steps:
      - name: Download Worker release
        uses: actions/download-artifact@v8
        with:
          name: worker-release
          path: release
      - name: Deploy public website
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc --message Git-${{ needs.quality.outputs.source_sha }}
          packageManager: npm
          workingDirectory: release
          wranglerVersion: 4.120.0
